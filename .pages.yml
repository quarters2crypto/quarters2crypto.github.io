media:
  - name: site_images
    label: Site images
    input: media/images
    output: /media/images
    rename: true
    categories: [image]
    commit:
      identity: user
  - name: site_files
    label: Site files
    input: media/files
    output: /media/files
    rename: true
    categories: [document, compressed, code, spreadsheet, font]
    commit:
      identity: user

settings:
  content: true
  commit:
    identity: user
    templates:
      create: "content(create): {path}"
      update: "content(update): {path}"
      delete: "content(delete): {path}"
      rename: "content(rename): {oldPath} -> {newPath}"

content:
  - name: site_settings
    label: Site settings
    description: Global copy — hero, socials, sponsor, footer, and the PHASEONE live switch.
    type: file
    path: content/site.json
    format: json
    fields:
      - name: meta
        label: Meta
        type: object
        fields:
          - name: title
            label: Browser title
            type: string
          - name: description
            label: Meta description
            type: text
      - name: hero
        label: Hero
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: headline_lines
            label: Headline lines
            type: string
            list: true
          - name: summary
            type: text
          - name: primary_label
            label: Primary CTA label
            type: string
          - name: primary_href
            label: Primary CTA link
            type: string
          - name: secondary_label
            label: Secondary CTA label
            type: string
          - name: secondary_href
            label: Secondary CTA link
            type: string
      - name: nav
        label: Navigation
        type: object
        fields:
          - name: phaseone
            label: PHASEONE10841 entry
            type: object
            fields:
              - name: label
                type: string
              - name: href
                label: Destination URL
                type: string
              - name: live
                label: Subdomain is live (flips cards from "Launching Soon" to a real link)
                type: boolean
              - name: status_label
                type: string
      - name: socials
        label: Social links
        type: object
        list: true
        fields:
          - name: label
            type: string
          - name: note
            type: string
          - name: url
            type: string
      - name: sponsor
        label: Sponsor module
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: title
            type: string
          - name: body
            type: text
          - name: cta_label
            type: string
          - name: url
            type: string
          - name: fine_print
            label: Fine print
            type: text
      - name: footer
        label: Footer
        type: object
        fields:
          - name: brand_blurb
            type: text
          - name: concordiapax_note
            type: text
          - name: bottom_left
            type: string
          - name: bottom_right
            type: string

  - name: dispatches
    label: Dispatches (Substack highlights)
    description: Curated list of featured posts. The full archive lives on Substack; this list is maintained by hand.
    type: file
    path: content/dispatches.json
    format: json
    fields:
      - name: posts
        label: Featured posts
        type: object
        list: true
        fields:
          - name: title
            type: string
          - name: date
            label: Date (YYYY-MM-DD)
            type: date
          - name: url
            label: Substack URL
            type: string
          - name: kind
            label: Kind (Dispatch / Lab Notes / Meta / Cosmic)
            type: string
          - name: description
            type: text

  - name: projects
    label: Projects
    description: "The workbench list. Status: active, incubating, paused, shipped, archived. Featured projects appear on the homepage."
    type: file
    path: content/projects.json
    format: json
    fields:
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - name: title
            type: string
          - name: status
            type: select
            options:
              values:
                - value: active
                  label: Active
                - value: incubating
                  label: Incubating
                - value: paused
                  label: Paused
                - value: shipped
                  label: Shipped
                - value: archived
                  label: Archived
          - name: category
            type: string
          - name: description
            type: text
          - name: link
            type: string
          - name: link_label
            type: string
          - name: featured
            label: Show on homepage
            type: boolean

  - name: page_home
    label: Homepage HTML (advanced)
    type: file
    path: index.html
    format: code

  - name: page_articles
    label: Articles page HTML (advanced)
    type: file
    path: articles.html
    format: code

  - name: page_projects
    label: Projects page HTML (advanced)
    type: file
    path: projects.html
    format: code

  - name: page_lab
    label: Lab page HTML (advanced)
    type: file
    path: lab.html
    format: code

  - name: page_about
    label: About page HTML (advanced)
    type: file
    path: about.html
    format: code

  - name: page_finance_manager
    label: Finance Manager page HTML (advanced)
    type: file
    path: finance_manager/index.html
    format: code

  - name: brand_tokens
    label: Brand tokens
    type: file
    path: brand-kit/cpax-q2c-design-tokens.json
    format: code

  - name: brand_theme_css
    label: Brand theme CSS
    type: file
    path: brand-kit/cpax-q2c-theme.css
    format: code

  - name: site_css
    label: Site CSS (advanced)
    type: file
    path: assets/css/site.css
    format: code

  - name: site_js
    label: Site JS (advanced)
    type: file
    path: assets/js/site.js
    format: code

  - name: brand_style_brief
    label: Brand style brief
    type: file
    path: brand-kit/cpax-q2c-style-brief.txt
    format: raw
